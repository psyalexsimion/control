<title>CTRL</title>
<style>
:root{--bg:#f3f4f1;--card:#fbfbf9;--ink:#1c2432;--mut:#667080;--ac:#7a2e3b;--ac2:#2e4a5e;--bd:#d6d9d3;--soft:#e9ebe6}
[data-theme=dark]{--bg:#12151c;--card:#1a1f29;--ink:#e8e6df;--mut:#98a2b0;--ac:#e0a1a9;--ac2:#9bb8c9;--bd:#2b3240;--soft:#222937}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.1rem}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:760px;margin:auto}
.logo{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;letter-spacing:.04em}.logo i{color:var(--ac);font-style:normal}
.tools button{margin-left:6px}
main{max-width:760px;margin:auto;padding:8px 18px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 14px;min-height:44px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.pri{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
[data-theme=dark] .pri{color:#14191a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin:0 0 14px}
.mut{color:var(--mut);font-size:.92rem}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.loop span{background:var(--soft);padding:5px 11px;border-radius:99px;font-size:.9rem}
.loop b{color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.go{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.go button{text-align:left;padding:14px}
.go strong{display:block;font-family:Georgia,serif;font-size:1.1rem}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:76px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--ac);min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .on,.sc .on{background:var(--ac2);color:var(--bg);border-color:var(--ac2)}
[data-theme=dark] .chips .on,[data-theme=dark] .sc .on{color:#12151c}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.sc button{padding:6px 2px;font-size:.82rem}
.bar{height:6px;background:var(--soft);border-radius:9px;margin:0 0 18px;overflow:hidden}.bar div{height:100%;background:var(--ac);transition:width .3s}
.m{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.m div{height:100%;background:var(--ac2)}
.m.hi div{background:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:.93rem}td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;vertical-align:top}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav{overflow-x:auto;justify-content:center;justify-content:safe center}nav button{flex:1;min-width:46px;white-space:nowrap;max-width:120px;border:0;background:none;font-size:.7rem;padding:6px 2px;border-radius:8px}
nav button.on{color:var(--ac);font-weight:700;background:var(--soft)}
/*nd*/.chips button{text-align:left}.tw{overflow-x:auto}
details{border-top:1px solid var(--bd);padding:8px 0}summary{cursor:pointer;font-weight:600}
.k{color:var(--mut);font-size:.85rem;margin-top:8px}
.warn{border-left:3px solid var(--ac);padding-left:12px}
@media print{nav,header,.row,.noprint{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

g_w:'Atenție',g_ws:['Obiectivul nu e „renunță la control”, ci alegerea flexibilă: când merită controlat și când poți tolera incertitudinea.','Nu promite „nu se va întâmpla nimic rău”; ținta e toleranța la „nu știu”.','Evită lupta de putere și rolul de „sursă de control” (teme rigide).','Dozează expunerea: ritm prea abrupt crește anxietatea și abandonul.','Evită etichetarea („ești controlor”) și interpretările prea rapide.','La TSA/ADHD nu trata automat controlul ca simplă compulsie sau intoleranță la incertitudine: verifică mai întâi funcția lui (predictibilitate, compensare executivă, reglare).'],
g_e:'Dovezi (din sinteza literaturii)',g_es:['CBT țintită pe IU: efecte mari asupra IU în GAD (meta-analiză, 26 studii); avantaj post-tratament față de CBT generală.','Meta-analiză 2026: CBT-IU și modelele metacognitive depășesc modelul bazat pe evitarea worry pe termen scurt; diferențele dispar la follow-up.','MCT: meta-analiză 2025 (21 studii), superioară listei de așteptare și unor CBT, cu limitări metodologice.','ACT: meta-analiză 2024 (67 studii, peste 9.000 participanți), crește flexibilitatea psihologică.','Perfecționism: meta-analiză 15 RCT, efecte medii-mari. TOC: ERP este tratament de primă linie.','IU este factor transdiagnostic; scăderea ei în CBT transdiagnostică (inclusiv grup, 151 pacienți) se asociază cu rezultate mai bune.','Prelegere Freeston (ian. 2026): IU văzută și ca vulnerabilitate trans-situațională, de ex. în eco-distres; domeniu în dezvoltare.'],

nd_t:"Controlul la adultul cu TSA și/sau ADHD",

nd_lv:[["1 · Nevoie reală de predictibilitate (TSA)","Exemplu: „Dacă știu exact ce urmează, pot funcționa.” Nu încercăm să eliminăm predictibilitatea, ar fi contraproductiv. Ținta: predictibilitate necesară → flexibilitate suficientă, adică să poată tolera mici deviații de la plan fără să intre în anxietate majoră."],
["2 · Control ca strategie executivă (ADHD)","Exemplu: „Dacă nu controlez eu totul, uit ceva / pierd ceva / întârzii / nu termin / devine haos.” Verifică: procrastinare, time blindness, dificultatea de a începe, uitare, dezorganizare, hiperfocus, dificultatea tranzițiilor, supraîncărcare de sarcini. Dacă sunt prezente, nu trata controlul ca pe o simplă compulsie. „Îmi fac lista de 4 ori” poate fi anxietate, dar și o strategie ADHD imperfectă pentru a nu uita."],

nd_lv:[["1 · Real need for predictability (ASD)","Example: “If I know exactly what comes next, I can function.” We do not try to remove predictability; that would backfire. Target: necessary predictability → sufficient flexibility, meaning being able to tolerate small deviations from the plan without major anxiety."],
["2 · Control as an executive strategy (ADHD)","Example: “If I do not control everything, I forget something / lose something / run late / do not finish / it turns to chaos.” Check: procrastination, time blindness, difficulty starting, forgetfulness, disorganization, hyperfocus, difficulty with transitions, task overload. If present, do not treat control as a simple compulsion. “I make my list 4 times” may be anxiety, but also an imperfect ADHD strategy for not forgetting."],

nd_eh:"Evidence (from the synthesis provided)",nd_es:["In autistic adults, preference for predictability and difficulty with uncertainty are common and linked to anxiety; there is support for the link between IU and anxiety in autism.","The literature on psychotherapy with autistic adults supports individualized adaptation rather than rigid application of a standard protocol.","ADHD-adapted CBT has support for reducing ADHD symptoms and anxiety/depression, including in recent meta-analyses.","Autistic adults show relevant difficulties in emotional reactivity and regulation, though the literature is still heterogeneous.","Psychotherapy can reduce IU in clinical populations; effects are less clear against another active psychotherapy.","Neurodiversity-affirming adaptations are among those most valued by autistic adults; a recent study (130 autistic adults, mostly women) found large individual variation in how useful different adaptations were."],

const score=d=>Object.fromEntries(DIMS.map(x=>[x,[0,1,2].reduce((a,j)=>a+(d[x+j]||0),0)]));
const ndSum=(id,d)=>{let h='';
 const sec=(ti,b)=>b?`<h3>${t(ti)}</h3>${b}`:'',li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'',tx=k=>d[k]?`<p><b>${t(k)}</b><br>${esc(d[k])}</p>`:'',pk=(k,o)=>d[k]===undefined?'':`<p><b>${t(k)}</b>: ${esc(t(o)[d[k]])}</p>`,w=k=>`<p class="warn">${t(k)}</p>`;
 if(id=='nd1'){const ex=d.ex||[],rg=d.rg||[],iu=d.iu4||[];
  h=sec('ndl1',tx('ndp_q')+tx('ndp_dev')+(d.ndp_ch!==undefined?`<p><b>${t('ndp_ch')}</b>: ${d.ndp_ch}/10</p>`:''))
  +sec('ndl2',li(ex.map(x=>t('exo')[x]))+(ex.length>=3?w('ex_hi'):ex.length?w('ex_lo'):''))
  +sec('ndl3',li(rg.map(x=>t('rgo')[x]))+(rg.length>=3?w('rg_hi'):''))
  +((rg.includes('mas')||d.mkq)?sec('ndlm',tx('mkq')+(rg.includes('mas')?w('mk_w'):'')):'')
  +sec('ndl4',li(iu.map(x=>t('iuo')[x]))+w(iu.length?'iu_go':'iu_no'))
  +`<h3>${t('nd_ord_t')}</h3><p>${t('nd_ord')}</p>`}
 else if(id=='nd2'){h=tx('q_sit')+tx('q_ctl')+tx('q_why')+pk('q_need','o_need')+tx('q_if')+pk('q_real','o_real')+pk('q_cat','o_cat');
  if(d.q_cat!==undefined)h+=`<h3>${t('cat_t')}</h3><p>${t('cat_act')[d.q_cat]}</p>`}
 else{h=tx('d_dom')+pk('d_lvl','o_lvl')+pk('d_step','o_step')+tx('d_pred')+tx('d_hap')+tx('d_learn');
  if(d.anx1!==undefined&&d.anx2!==undefined)h+=`<p><b>${d.anx1} → ${d.anx2}</b></p>`}
 return h};
const hub=()=>`<h1>${t('nd_t')}</h1><p>${t('nd_i')}</p>
<h2>${t('nd_tools')}</h2><div class="go">${['nd1','nd2','nd3'].map(k=>`<button data-a="sn" data-v="${k}"><strong>${t(k)}</strong><span class="mut">${t(k+'d')}</span></button>`).join('')}</div>
<div class="card" style="margin-top:14px"><h3>${t('nd_lvh')}</h3>${t('nd_lv').map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div>
<div class="card"><h3>${t('nd_cath')}</h3><table>${t('nd_cats').map(x=>`<tr><td><b>${x[0]}</b><br><span class="mut">${x[1]}</span></td><td>${x[2]}</td></tr>`).join('')}</table><p class="warn" style="margin-top:12px">${t('nd_cq')}</p></div>
<div class="card"><h3>${t('nd_exh')}</h3><div class="tw"><table><tr>${t('nd_exc').map(x=>`<th>${x}</th>`).join('')}</tr>${t('nd_exr').map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div></div>
<div class="card"><h3>${t('nd_dh')}</h3><p>${t('nd_dp')}</p><ol>${t('o_step').map(x=>`<li>${x}</li>`).join('')}</ol></div>
${[['nd_fh','nd_fs'],['nd_wh','nd_ws'],['nd_eh','nd_es']].map(([a,b])=>`<div class="card"><h3>${t(a)}</h3><ul>${t(b).map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}
<p class="mut">${t('nd_src')}</p>`;
const sumH=(id,d)=>{let h='';
 if(id.startsWith('nd'))h=ndSum(id,d);
 else if(id=='prof'){const s=score(d),top=DIMS.filter(x=>s[x]>=4).sort((a,b)=>s[b]-s[a]).slice(0,2);
  h=DIMS.map(x=>`<div style="margin:0 0 12px"><div style="display:flex;justify-content:space-between"><span>${t('dim_'+x)}</span><b>${s[x]}/12 · ${t('lvl')[lv(s[x])]}</b></div><div class="m ${s[x]>=8?'hi':''}"><div style="width:${s[x]/12*100}%"></div></div></div>`).join('');
  if(top.length)h+=`<h3>${t('top')}</h3><ul>${top.map(x=>`<li>${t('f_'+x)}</li>`).join('')}</ul>`;
  h+=`<p class="mut warn">${t('disc')}</p><p class="mut warn">${t('nd_note')}</p>`}
 else{const rows=(id=='cyc'?['trig','interp','hard','anx1','imp','impr','beh','rel','anx2','cost','prot']:id=='inf'?['can','cant','waste','choose']:['sit','want','pred','anx1','plan','did','hap','anx2','learn']);
  if(id=='cyc'&&(d.ctl||[]).length){const f=[...new Set(d.ctl.map(k=>CHIP[k]))];h+=`<p>${d.ctl.map(k=>t('ch')[k]).join(', ')}</p><h3>${t('top')}</h3><ul>${f.map(x=>`<li>${t('f_'+x)}</li>`).join('')}</ul>`}
  if(id=='cyc')[['sb','sbl','sbq'],['bl','bel','belq']].forEach(([k,o,q])=>{if((d[k]||[]).length)h+=`<p><b>${t(q)}</b><br>${d[k].map(x=>t(o)[x]).join(', ')}</p>`});
  h+=`<table>${rows.filter(k=>d[k]!==undefined&&d[k]!=='').map(k=>`<tr><th>${t(k)}</th><td>${esc(d[k])}</td></tr>`).join('')}</table>`;
  if(d.anx1!==undefined&&d.anx2!==undefined)h+=`<p><b>${d.anx1} → ${d.anx2}</b></p>`}
 return h};
const home=()=>`<h1>${t('h_title')}</h1><p>${t('h_sub')}</p><div class="loop">${t('loop').map((x,i,a)=>`<span>${x}</span>${i<a.length-1?'<b>→</b>':'<b>↻</b>'}`).join('')}</div>
<h2>${t('h_go')}</h2><div class="go">${['prof','cyc','inf','exp','nd'].map(k=>`<button data-a="tab" data-v="${k}"><strong>${t('n_'+k)}</strong><span class="mut">${t('d_'+k)}</span></button>`).join('')}</div>
<p class="mut" style="margin-top:20px">${t('h_priv')}</p>`;
const intro=k=>`<h2>${t('n_'+k)}</h2><div class="card"><p>${t('d_'+k)}</p>${k=='prof'?`<p class="mut">${t('disc')}</p>`:''}<div class="row"><button class="pri" data-a="start">${t('start')}</button></div></div>`;
const wiz=()=>{const ss=steps(W.id),s=ss[W.i],last=W.i==ss.length-1;
 let h=`<div class="bar"><div style="width:${(W.i+1)/ss.length*100}%"></div></div><p class="mut">${t('step')} ${W.i+1} ${t('of')} ${ss.length}</p>`;
 if(s.sum)h+=`<h2>${t(W.id=='prof'?'n_prof':'c4')}</h2><div class="card" id="rep">${sumH(W.id,W.d)}</div><div class="noprint"><label for="cl">${t('client')}</label><input type="text" id="cl" value="${esc(W.c||'')}"></div><div class="row"><button data-a="back">${t('back')}</button><button class="pri" data-a="save">${t('save')}</button><button data-a="print">${t('print')}</button></div>`;
 else h+=`<h2>${t(s.t)}</h2>${s.h?`<p class="mut">${t(s.h)}</p>`:''}<div class="card">${s.f.map(fld).join('')}</div><div class="row">${W.i?`<button data-a="back">${t('back')}</button>`:''}<button class="pri" data-a="next">${t('next')}</button></div>`;
 return h};
const guide=()=>`<h2>${t('g_t')}</h2><div class="card"><h3>${t('g_i')}</h3><table>${t('g_rows').map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</table></div>
${[['g_a','g_as'],['g_p','g_ps'],['g_q','g_qs'],['g_s','g_ss'],['g_c','g_cs'],['g_w','g_ws'],['g_e','g_es']].map(([a,b])=>`<div class="card"><h3>${t(a)}</h3><ul>${t(b).map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<p class="mut">${t('g_n')}</p>`;
const hist=()=>{const a=db().reverse();return`<h2>${t('hs_t')}</h2>${msg?`<p class="warn">${msg}</p>`:''}${a.length?a.map(r=>`<div class="card"><details><summary>${t('ty')[r.id]} · ${new Date(r.date).toLocaleDateString(S.lang)}${r.client?' · '+esc(r.client):''}</summary>${sumH(r.id,r.d)}<div class="row"><button data-a="del" data-v="${r.date}">${t('del')}</button></div></details></div>`).join('')+`<div class="row"><button data-a="exp">${t('exp')}</button><button data-a="clr">${t('clr')}</button></div>`:`<p class="mut">${t('hs_e')}</p>`}`};
function view(){document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;
 $('#bl').textContent=S.lang=='ro'?'EN':'RO';$('#bt').textContent=S.theme=='dark'?'☀':'☾';
 $('#nv').innerHTML=['home','prof','cyc','inf','exp','nd','gd','hs'].map(k=>`<button data-a="tab" data-v="${k}" class="${S.tab==k?'on':''}">${t('n_'+k)}</button>`).join('');
 const m=$('#m');m.innerHTML=S.tab=='home'?home():S.tab=='gd'?guide():S.tab=='hs'?hist():W?wiz():S.tab=='nd'?hub():intro(S.tab)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='tab'){S.tab=v;W=null;msg=''}
 else if(a=='lang'){S.lang=S.lang=='ro'?'en':'ro';st.s('ctrl.lang',S.lang)}
 else if(a=='theme'){S.theme=S.theme=='dark'?'light':'dark';st.s('ctrl.theme',S.theme)}
 else if(a=='start')W={id:S.tab,i:0,d:{}};
 else if(a=='sn'){W={id:v,i:0,d:{}};scrollTo(0,0)}
 else if(a=='next'){W.i++;scrollTo(0,0)}
 else if(a=='back'){W.c=($('#cl')||{}).value;W.i--;scrollTo(0,0)}
 else if(a=='sc')W.d[b.dataset.k]=+v;
 else if(a=='chip'){const k=b.dataset.k,c=W.d[k]=W.d[k]||[];const i=c.indexOf(v);i<0?c.push(v):c.splice(i,1)}
 else if(a=='save'){const x=db();x.push({id:W.id,date:new Date().toISOString(),client:$('#cl').value.trim(),d:W.d});sd(x);W=null;S.tab='hs';msg=t('saved')}
 else if(a=='print')return print();
 else if(a=='del'){sd(db().filter(r=>r.date!=v))}
 else if(a=='clr'){if(confirm(t('conf')))sd([])}
 else if(a=='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(db(),null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='ctrl-export.json';l.click();return}
 view()});
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k||!W)return;W.d[k]=e.target.type=='range'?+e.target.value:e.target.value;if(e.target.type=='range')$('#o_'+k).textContent=e.target.value});
view();
</script>
</body>
</html>
